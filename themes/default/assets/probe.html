<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>播放排查</title>
<style>
  body { margin: 0; padding: 20px; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #1f2329; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .bar input { flex: 1; padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; }
  .bar button { padding: 8px 16px; border: 0; border-radius: 4px; background: #2563eb; color: #fff; font-size: 13px; cursor: pointer; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #fff; border-radius: 6px; padding: 12px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: #646a73; font-weight: 400; }
  .box { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 4px; overflow: hidden; }
  .box > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tip { margin-top: 12px; font-size: 12px; color: #8a9099; }
  .link { margin-top: 8px; font-size: 12px; word-break: break-all; }
  .link a { color: #2563eb; }
</style>
</head>
<body>
<h1>播放排查：同一地址，两种播放器</h1>
<div class="bar">
  <input id="url" placeholder="m3u8 地址">
  <button id="load">加载</button>
</div>

<div class="row">
  <div class="card">
    <h2>A · 纯 hls.js（原生 video，不套播放器）</h2>
    <div class="box"><video id="plain" controls playsinline></video></div>
  </div>
  <div class="card">
    <h2>B · ArtPlayer（站点实际使用的播放器）</h2>
    <div class="box" id="art"></div>
  </div>
</div>

<div class="tip" id="tip"></div>
<div class="link" id="link"></div>

<script src="/assets/vendor/hls.min.js"></script>
<script src="/assets/vendor/artplayer.min.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var input = document.getElementById('url');
  var tip = document.getElementById('tip');
  var linkBox = document.getElementById('link');
  var plain = document.getElementById('plain');
  var artBox = document.getElementById('art');
  var hlsPlain = null;
  var art = null;

  var defaultUrl = params.get('url') || '';
  input.value = defaultUrl;

  function destroy() {
    if (hlsPlain) { try { hlsPlain.destroy(); } catch (e) {} hlsPlain = null; }
    if (art) { try { art.destroy(); } catch (e) {} art = null; }
    plain.removeAttribute('src');
    plain.load();
    artBox.innerHTML = '';
  }

  function play(url) {
    if (!url) return;
    destroy();
    history.replaceState(null, '', '?url=' + encodeURIComponent(url));
    linkBox.innerHTML = '当前地址：<a href="' + url + '" target="_blank" rel="noreferrer">' + url + '</a>';

    /* A：纯 hls.js */
    hlsPlain = new window.Hls({ enableWorker: true, lowLatencyMode: false });
    hlsPlain.loadSource(url);
    hlsPlain.attachMedia(plain);
    hlsPlain.on(window.Hls.Events.ERROR, function (_e, data) {
      if (data && data.fatal) tip.textContent = 'A 播放错误：' + data.type + ' / ' + data.details;
    });

    /* B：ArtPlayer */
    try {
      art = new window.Artplayer({
        container: artBox,
        url: url,
        type: 'm3u8',
        autoplay: false,
        hotkey: true,
        fullscreen: true,
        setting: true,
        customType: {
          m3u8: function (element, target) {
            var instance = new window.Hls({ enableWorker: true, lowLatencyMode: false });
            instance.loadSource(target);
            instance.attachMedia(element);
            instance.on(window.Hls.Events.ERROR, function (_e, data) {
              if (data && data.fatal) tip.textContent = 'B 播放错误：' + data.type + ' / ' + data.details;
            });
          },
        },
      });
    } catch (error) {
      tip.textContent = 'B 初始化失败：' + error.message;
    }

    tip.textContent = '';
  }

  document.getElementById('load').addEventListener('click', function () {
    play(input.value.trim());
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') play(input.value.trim());
  });

  if (defaultUrl) play(defaultUrl);
})();
</script>
</body>
</html>
