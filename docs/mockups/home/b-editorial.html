<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 B · 杂志编排</title>
<style>
:root{
  --bg:#0b0b0c;--surface:#141416;--surface-2:#191a1d;--line:rgba(255,255,255,.09);
  --text:#f0ece6;--text-2:#a5a29c;--text-3:#7a7772;
  --gold:#d8a657;--gold-soft:rgba(216,166,87,.14);
  --serif:"Songti SC",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block}
.wrap{width:min(1440px,100% - 120px);margin:0 auto}

/* 报头 */
.masthead{padding:26px 0 20px;border-bottom:1px solid var(--line)}
.masthead .wrap{display:flex;align-items:center;gap:34px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.14em}
.brand i{font-style:normal;font-size:10.5px;letter-spacing:.32em;color:var(--text-3);text-transform:uppercase}
.nav{display:flex;gap:30px;margin-left:auto;font-size:13.5px;letter-spacing:.12em;color:var(--text-2)}
.nav a{padding:4px 0;border-bottom:1px solid transparent;transition:.18s}
.nav a:hover{color:var(--gold);border-color:var(--gold)}
.nav a.on{color:var(--gold);border-color:var(--gold)}
.tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--text-2)}
.tool:hover{border-color:var(--gold);color:var(--gold)}

/* 日期线 */
.dateline{display:flex;align-items:center;gap:16px;padding:14px 0;font-size:12px;letter-spacing:.14em;
  color:var(--text-3);border-bottom:1px solid var(--line)}
.dateline .rule{flex:1;height:1px;background:var(--line)}
.dateline b{color:var(--gold);font-weight:500}

/* 首屏：左主推 + 右列表 */
.lead{display:grid;grid-template-columns:1.42fr 1fr;gap:44px;padding:40px 0 54px;align-items:start}
.feature{display:flex;flex-direction:column;gap:20px}
.feature .art{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--surface-2);border-radius:2px}
.feature .art::after{content:attr(data-name);position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--serif);font-size:20px;color:#5d5a55}
.feature .art img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:center 22%;
  transition:transform .8s cubic-bezier(.2,.8,.2,1);filter:saturate(.94)}
.feature:hover .art img{transform:scale(1.035)}
.feature .art .veil{position:absolute;z-index:2;inset:0;background:linear-gradient(0deg,rgba(11,11,12,.85),rgba(11,11,12,0) 52%)}
.feature .art .corner{position:absolute;z-index:3;left:0;top:0;padding:8px 14px;font-size:11px;letter-spacing:.22em;
  background:var(--gold);color:#1a1508;text-transform:uppercase}
.feature h1{font-family:var(--serif);font-size:clamp(30px,3vw,44px);line-height:1.2;font-weight:600;
  margin:0;letter-spacing:.01em}
.feature .sub{font-family:var(--serif);font-size:15px;color:var(--text-3);margin-top:-6px;font-style:italic}
.feature .meta{display:flex;gap:14px;align-items:center;font-size:12.5px;letter-spacing:.08em;color:var(--text-2)}
.feature .meta span:not(:last-child)::after{content:"·";margin-left:14px;color:var(--text-3)}
.feature p.desc{margin:0;color:#b8b4ad;font-size:14.5px;line-height:1.9;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feature .go{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;letter-spacing:.14em;color:var(--gold);
  border-bottom:1px solid var(--gold-soft);padding-bottom:5px;align-self:flex-start;transition:.2s}
.feature .go:hover{gap:16px;border-color:var(--gold)}

/* 右：今日更新索引 */
.index h2{margin:0 0 4px;font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.26em;color:var(--text-2)}
.index .hint{font-size:11.5px;letter-spacing:.1em;color:var(--text-3);margin-bottom:16px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:26px 1fr auto;align-items:baseline;gap:12px;
  padding:11px 6px;border-bottom:1px dashed rgba(255,255,255,.08);transition:.16s}
.row:hover{background:linear-gradient(90deg,var(--gold-soft),transparent);padding-left:12px}
.row .no{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.row .nm{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .16s}
.row:hover .nm{color:var(--gold)}
.row .rm{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.index .all{display:inline-block;margin-top:16px;font-size:12.5px;letter-spacing:.16em;color:var(--text-2)}
.index .all:hover{color:var(--gold)}

/* 分区：竖排标题 + 小海报 */
.sect{display:grid;grid-template-columns:120px 1fr;gap:34px;padding:44px 0;border-top:1px solid var(--line)}
.sect-hd{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:12px}
.sect-hd h3{margin:0;font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.34em;
  writing-mode:vertical-rl;color:var(--text)}
.sect-hd .cnt{font-size:11.5px;letter-spacing:.16em;color:var(--text-3)}
.sect-hd .ln{width:24px;height:1px;background:var(--gold);opacity:.8}
.sect-hd a{font-size:11.5px;letter-spacing:.16em;color:var(--gold);margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:24px 20px}
.c{display:flex;flex-direction:column;gap:9px;min-width:0}
.c .art{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--surface-2);border-radius:2px}
.c .art::after{content:attr(data-name);position:absolute;inset:0;display:grid;place-items:center;padding:10px;
  font-size:12px;color:#5d5a55;text-align:center}
.c .art img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;
  transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .3s;filter:saturate(.9) brightness(.96)}
.c:hover .art img{transform:scale(1.05);filter:saturate(1) brightness(1)}
.c .art .rm{position:absolute;z-index:2;left:0;bottom:0;right:0;padding:16px 8px 7px;font-size:11px;
  color:#efe9df;background:linear-gradient(0deg,rgba(11,11,12,.9),transparent)}
.c .t{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .16s}
.c:hover .t{color:var(--gold)}
.c .m{font-size:11.5px;color:var(--text-3);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 页脚 */
.foot{border-top:1px solid var(--line);padding:30px 0 70px;display:flex;justify-content:space-between;
  gap:20px;flex-wrap:wrap;font-size:12px;letter-spacing:.08em;color:var(--text-3)}
.pick{position:fixed;left:18px;bottom:18px;z-index:99;font-size:12px;letter-spacing:.06em;padding:7px 13px;
  border-radius:999px;background:var(--gold-soft);color:var(--gold);border:1px solid rgba(216,166,87,.4);
  backdrop-filter:blur(10px)}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="brand"><b>蓝草莓影视</b><i>Lan Cao Mei Cinema</i></div>
    <nav class="nav">
      <a class="on" href="#">首页</a><a href="#">电影</a><a href="#">剧集</a><a href="#">综艺</a><a href="#">动漫</a>
    </nav>
    <a class="tool" href="#" title="搜索">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </a>
  </div>
</header>

<div class="wrap">
  <div class="dateline">
    <span id="today"></span><span class="rule"></span>
    <span>今日上新 <b id="newCount"></b> 部</span><span>·</span>
    <span>在库 <b id="total"></b> 部</span>
  </div>

  <section class="lead">
    <article class="feature" id="feature"></article>
    <aside class="index">
      <h2>今日更新</h2>
      <div class="hint">TODAY&nbsp;&nbsp;·&nbsp;&nbsp;更新最快的在这里</div>
      <div class="rows" id="rows"></div>
      <a class="all" href="#">全部新片 ›</a>
    </aside>
  </section>

  <section class="sect">
    <div class="sect-hd">
      <h3>电影</h3><span class="ln"></span>
      <span class="cnt" id="cnt-dy"></span>
      <a href="#">更多 ›</a>
    </div>
    <div class="cards" id="cards-dy"></div>
  </section>

  <section class="sect">
    <div class="sect-hd">
      <h3>剧集</h3><span class="ln"></span>
      <span class="cnt" id="cnt-jj"></span>
      <a href="#">更多 ›</a>
    </div>
    <div class="cards" id="cards-jj"></div>
  </section>

  <section class="sect">
    <div class="sect-hd">
      <h3>综艺</h3><span class="ln"></span>
      <span class="cnt" id="cnt-zy"></span>
      <a href="#">更多 ›</a>
    </div>
    <div class="cards" id="cards-zy"></div>
  </section>

  <section class="sect">
    <div class="sect-hd">
      <h3>动漫</h3><span class="ln"></span>
      <span class="cnt" id="cnt-dm"></span>
      <a href="#">更多 ›</a>
    </div>
    <div class="cards" id="cards-dm"></div>
  </section>

  <footer class="foot">
    <span>本站所有内容均收集自互联网，仅供学习交流，请勿用于商业用途。</span>
    <span>蓝草莓影视 · 2026</span>
  </footer>
</div>

<div class="pick">方案 B · 杂志编排</div>

<script src="data.js"></script>
<script>
const S = window.SITE;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

$('today').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
$('newCount').textContent = S.today.length;
$('total').textContent = S.total.toLocaleString();

/* 主推：今日更新里集数最多的一部（剧集优先做主视觉） */
const hero = [...S.today].sort((a, b) => (b.e || 0) - (a.e || 0))[0] || S.all[0];
$('feature').innerHTML = `
  <div class="art" data-name="${esc(hero.n)}">
    <img src="${esc(hero.c)}" alt="${esc(hero.n)}">
    <span class="veil"></span>
    <span class="corner">本期主推</span>
  </div>
  <h1>${esc(hero.n)}</h1>
  ${hero.subName ? `<div class="sub">${esc(hero.subName)}</div>` : ''}
  <div class="meta">
    <span>${esc(hero.g || '')}</span><span>${hero.y || '—'}</span>
    <span>${esc(hero.a || '—')}</span><span>${esc(hero.r || '—')}</span>
  </div>
  <p class="desc">${esc(S.desc[hero.id] || '暂无简介')}</p>
  <a class="go" href="#">立即观看 →</a>`;

$('rows').innerHTML = S.today.slice(0, 10).map((it, i) => `
  <a class="row" href="#">
    <span class="no">${String(i + 1).padStart(2, '0')}</span>
    <span class="nm">${esc(it.n)}</span>
    <span class="rm">${esc(it.r || it.y || '')}</span>
  </a>`).join('');

function card(it){
  const meta = [it.y || '未知', it.a].filter(Boolean).join(' / ');
  return `<a class="c" href="#">
    <div class="art" data-name="${esc(it.n)}">
      <img src="${esc(it.c)}" alt="${esc(it.n)}" loading="lazy">
      ${it.r ? `<span class="rm">${esc(it.r)}</span>` : ''}
    </div>
    <span class="t">${esc(it.n)}</span>
    <span class="m">${esc(meta)}${it.g ? ' · ' + esc(it.g) : ''}</span>
  </a>`;
}
const fill = (key, box, cnt) => {
  const items = S[key].slice(0, 12);
  $(box).innerHTML = items.map(card).join('');
  if (cnt) $(cnt).textContent = items.length + ' 部';
};
fill('dianying', 'cards-dy', 'cnt-dy');
fill('juji', 'cards-jj', 'cnt-jj');
fill('zongyi', 'cards-zy', 'cnt-zy');
fill('dongman', 'cards-dm', 'cnt-dm');
</script>
</body>
</html>
