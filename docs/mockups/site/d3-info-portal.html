<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蓝草莓影视 · D3 信息港 · 整站视觉原型</title>
<style>
/*
  D3 · 信息港 — 设计契约
  使命：片库大、目标明确的采集站。首屏即密度，一屏看到几十部片；层级只靠字号/留白/1px 描边，不靠装饰。
  语义 token：--bg 底 / --surface 面板 / --surface-2 次级面板 / --line 分隔
             --primary 可交互 & 选中 / --hot 排名前三 & 备注
             --text 正文 / --text-2 次要 / --text-3 弱化
  节奏：4px 基准（--s1..--s8 = 4/8/12/16/20/24/32/40），圆角 5/6/8，无渐变、无玻璃、无阴影堆叠。
  Do：表格化密度、等宽数字、单行截断、焦点环可见、状态用底色+描边表达。
  Don't：hero 轮播、大圆角、悬浮卡片投影、装饰性动画、任何数据里没有的评分/播放量。
*/
:root{
  --bg:#0d0f12;
  --surface:#15181d;
  --surface-2:#1b1f25;
  --line:#262b33;
  --line-2:#333a45;
  --text:#e8ebef;
  --text-2:#9aa3ae;
  --text-3:#6e7783;
  --primary:#22b8a6;
  --primary-ink:#04241f;
  --primary-soft:rgba(34,184,166,.13);
  --primary-line:rgba(34,184,166,.45);
  --hot:#ff6b57;
  --hot-soft:rgba(255,107,87,.12);

  --r-xs:4px; --r-sm:5px; --r-md:6px; --r-lg:8px; --r-pill:999px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;

  --fs-meta:11.5px; --fs-body:13.5px; --fs-card:13.5px; --fs-block:16px;
  --fs-h1:22px; --fs-name:26px; --fs-nav:14px;

  --top-h:56px;
  --ease:cubic-bezier(.22,.8,.32,1);
  --dur-1:120ms;
  --dur-2:220ms;
  --wrap:1560px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:var(--fs-body);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
img{display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
b{font-weight:600}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:3px}
::selection{background:var(--primary-soft);color:#fff}
.wrap{width:min(var(--wrap),100% - 64px);margin:0 auto}
.muted{color:var(--text-3);font-size:var(--fs-meta)}

/* ── 顶栏 ─────────────────────────────── */
.top{position:sticky;top:0;z-index:50;background:#11141a;border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:var(--s5);height:var(--top-h)}
.logo{display:flex;align-items:center;gap:var(--s2);font-size:16.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.logo-mark{width:16px;height:16px;border-radius:var(--r-xs);background:var(--primary);display:block;flex:none}
.nav{display:flex;align-items:center;gap:2px;min-width:0}
.navbtn{padding:6px 10px;border-radius:var(--r-sm);font-size:var(--fs-nav);color:var(--text-2);transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.navbtn:hover{background:var(--surface-2);color:var(--text)}
.navbtn[aria-current="true"]{color:var(--primary);background:var(--primary-soft)}

.search{margin-left:auto;display:flex;height:34px;width:300px;min-width:0;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;transition:border-color var(--dur-1) var(--ease)}
.search:focus-within{border-color:var(--primary-line)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;padding:0 12px;color:var(--text);font-size:13px}
.search input::placeholder{color:var(--text-3)}
.search input::-webkit-search-cancel-button{filter:invert(.6)}
.search button{flex:none;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:12.5px;padding:0 16px;
  transition:filter var(--dur-1) var(--ease)}
.search button:hover{filter:brightness(1.08)}
.search button:active{filter:brightness(.92)}

/* 视图分段控件 */
.seg{display:flex;align-items:center;gap:2px;padding:3px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-md);flex:none}
.seg [role="tab"]{padding:4px 11px;border-radius:var(--r-xs);font-size:12.5px;line-height:1.5;color:var(--text-2);
  border:1px solid transparent;transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
.seg [role="tab"]:hover{color:var(--text);background:rgba(255,255,255,.04)}
.seg [role="tab"][aria-selected="true"]{background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary);font-weight:600}

/* ── 主体 ─────────────────────────────── */
main{padding:var(--s5) 0 0}
.view{display:block}
.block-hd{display:flex;align-items:center;gap:var(--s2);margin:0 0 var(--s3);min-height:22px}
.block-hd h1,.block-hd h2{margin:0;font-weight:700}
.block-hd h1{font-size:var(--fs-h1)}
.block-hd h2{font-size:var(--fs-block)}
.block-hd .cnt{margin-left:auto;font-size:var(--fs-meta);color:var(--text-3);font-variant-numeric:tabular-nums}
.block-hd .go{font-size:12.5px;color:var(--text-2);padding:3px 8px;border-radius:var(--r-sm);border:1px solid transparent;
  transition:color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
.block-hd .go:hover{color:var(--primary);border-color:var(--primary-line)}
.accent{width:3px;height:14px;border-radius:2px;background:var(--primary);display:block;flex:none}

/* 筛选条 */
.filterbar{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;padding:0 0 var(--s3);
  border-bottom:1px solid var(--line);margin-bottom:var(--s5)}
.bar-row{display:flex;align-items:center;gap:var(--s2);min-width:0}
.bar-row + .bar-row{padding-left:var(--s4);border-left:1px solid var(--line)}
.bar-lbl{font-size:12px;color:var(--text-3);letter-spacing:.06em;white-space:nowrap;flex:none}
.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:12.5px;white-space:nowrap;
  transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
.chip:hover{border-color:var(--primary-line);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.bar-note{flex-basis:100%;margin:0;font-size:12px;color:var(--hot);line-height:1.5}

/* 两栏 */
.main{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:var(--s6);align-items:start;padding-bottom:var(--s7)}
.colmain{min-width:0}

/* 网格 + 卡片 */
.grid-6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s5) var(--s4)}
.card{display:flex;flex-direction:column;gap:5px;min-width:0;
  animation:cardIn var(--dur-2) var(--ease) both;animation-delay:calc(var(--i,0) * 11ms)}
.art{position:relative;display:block;aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line)}
.art::after{content:attr(data-name);position:absolute;inset:0;z-index:0;display:grid;place-items:center;
  padding:var(--s2);font-size:11.5px;line-height:1.5;color:#5d6570;text-align:center;overflow:hidden}
.art img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;
  transition:transform var(--dur-2) var(--ease)}
.card:hover .art img{transform:scale(1.035)}
.card:hover .art{border-color:var(--primary-line)}
.card:hover .cname{color:var(--primary)}
.rm{position:absolute;z-index:2;top:5px;right:5px;max-width:calc(100% - 10px);padding:1px 6px;border-radius:var(--r-xs);
  background:rgba(13,15,18,.82);color:#dfe5ec;font-size:11px;line-height:1.6;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cname{font-size:var(--fs-card);line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color var(--dur-1) var(--ease)}
.cmeta{font-size:var(--fs-meta);color:var(--text-3);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:flex-start;gap:var(--s2);
  padding:var(--s7) var(--s5);border:1px dashed var(--line-2);border-radius:var(--r-lg);background:var(--surface)}
.empty b{font-size:14px}
.empty span{font-size:12.5px;color:var(--text-2)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 16px;
  border-radius:var(--r-sm);font-size:13.5px;font-weight:600;border:1px solid var(--line);
  background:var(--surface-2);color:var(--text);
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.btn:hover{border-color:var(--line-2);background:#20252c}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:#29c9b5;border-color:#29c9b5}
.btn-ghost{background:none;height:30px;font-weight:500;color:var(--text-2)}
.btn-ghost:hover{color:var(--text);background:var(--surface-2)}

/* 分页 */
.pager{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:var(--s6);flex-wrap:wrap}
.pg{min-width:32px;height:32px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--text-2);
  font-size:13px;font-variant-numeric:tabular-nums;
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.pg:hover:not([aria-disabled="true"]){border-color:var(--primary-line);color:var(--text)}
.pg[aria-current="page"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.pg[aria-disabled="true"]{color:var(--text-3);cursor:default}
.pg.dots{border:0;background:none;color:var(--text-3);cursor:default;min-width:20px;padding:0}
.pager-note{margin:var(--s2) 0 0;text-align:center;font-size:12px;color:var(--text-3)}

/* 侧栏 */
.side{display:grid;gap:var(--s3);position:sticky;top:calc(var(--top-h) + var(--s4));align-self:start;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s3) var(--s3) var(--s3)}
.panel-hd{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.panel-hd h3{margin:0;font-size:14px;font-weight:700}
.panel-hd .n{margin-left:auto;font-size:11px;color:var(--text-3);letter-spacing:.04em}

.rank{display:flex;flex-direction:column}
.rk{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:var(--s2);
  padding:5px 4px;border-radius:var(--r-xs);transition:background var(--dur-1) var(--ease)}
.rk:hover{background:var(--surface-2)}
.rk .no{font-size:12px;font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums;text-align:center}
.rk:nth-child(-n+3) .no{color:var(--hot)}
.rk .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk:hover .nm{color:var(--primary)}
.rk .x{font-size:11px;color:var(--text-3);max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2) var(--s3)}
.mini a{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.mini .art{border-radius:var(--r-sm)}
.mini .art::after{font-size:10px;padding:4px}
.mini .t{font-size:11.5px;line-height:1.35;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini a:hover .t{color:var(--primary)}

.cat-links{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cat-links button{text-align:left;font-size:12.5px;color:var(--text-2);padding:5px 8px;border-radius:var(--r-xs);
  background:var(--surface-2);border:1px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
.cat-links button:hover{color:var(--primary);border-color:var(--primary-line)}

/* ── 详情 ─────────────────────────────── */
.crumbs{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-3);margin-bottom:var(--s4);flex-wrap:wrap}
.crumbs a:hover{color:var(--primary)}
.crumbs .note-inline{color:var(--hot);font-size:12px}
.detail{display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--s7);align-items:start}
.poster{aspect-ratio:2/3;border-radius:var(--r-lg)}
.pcol{display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.pside{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);font-size:var(--fs-meta);color:var(--text-3)}
.dinfo{min-width:0}
.dmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:var(--s2)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--r-xs);
  font-size:12px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.hot{color:var(--hot);background:var(--hot-soft);border-color:rgba(255,107,87,.32)}
.dname{font-size:var(--fs-name);font-weight:700;line-height:1.3;margin:0 0 var(--s3);letter-spacing:-.01em;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s1);margin:0 0 var(--s5)}
.facts>div{display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--s2);align-items:start}
.facts dt{font-size:12.5px;color:var(--text-3);line-height:1.75}
.facts dd{margin:0;font-size:13px;color:var(--text-2);line-height:1.75;overflow-wrap:anywhere}
.facts dd.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lines-row{display:flex;gap:var(--s3);align-items:flex-start;margin-bottom:var(--s4);min-width:0}
.line-pills{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.line-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:12.5px;
  transition:border-color var(--dur-1) var(--ease),background var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.line-pill span{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.line-pill:hover{border-color:var(--primary-line);color:var(--text)}
.line-pill[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.line-pill[aria-pressed="true"] span{color:var(--primary);opacity:.75}
.actions{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s5);padding-bottom:var(--s5);border-bottom:1px solid var(--line)}
.actions .btn-primary{height:36px;padding:0 18px}
.actions-note{font-size:12.5px;color:var(--text-3)}
.syn-hd{font-size:var(--fs-block);font-weight:700;margin:0 0 var(--s2)}
.syn{margin:0;font-size:13.5px;line-height:1.85;color:var(--text-2);overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.syn.is-open{display:block;-webkit-line-clamp:unset;overflow:visible}
.linkbtn{margin-top:var(--s2);font-size:12.5px;color:var(--primary);padding:2px 0}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.section-gap{margin-top:var(--s7)}

/* ── 播放 ─────────────────────────────── */
.play-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:var(--s6);align-items:start;padding-bottom:var(--s7)}
.play-main{min-width:0}
.stage{position:relative;display:grid;place-items:center;aspect-ratio:16/9;border:1px solid var(--line);
  border-radius:var(--r-lg);background:#07090b;overflow:hidden}
.stage-badge{position:absolute;z-index:2;top:10px;left:10px;padding:2px 8px;border-radius:var(--r-xs);
  background:rgba(13,15,18,.82);border:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#dfe5ec}
.stage-center{display:flex;flex-direction:column;align-items:center;gap:var(--s3);padding:var(--s4);text-align:center}
.stage-play{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#e8ebef;
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease),transform var(--dur-1) var(--ease)}
.stage-play:hover{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.stage-play:active{transform:scale(.96)}
.stage-hint{margin:0;font-size:12px;color:#7c8794;line-height:1.6;max-width:38ch}
.stage-hint b{color:#cfd6df;font-weight:600}
.stage.is-playing .stage-play{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:var(--s2)}
.ep{height:32px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  color:var(--text-2);font-size:12.5px;font-variant-numeric:tabular-nums;
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.ep:hover{border-color:var(--primary-line);color:var(--text)}
.ep[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.ep-note{margin:var(--s2) 0 0;font-size:12px;color:var(--text-3);line-height:1.6}
.play-side{display:grid;gap:var(--s3);position:sticky;top:calc(var(--top-h) + var(--s4));align-self:start;min-width:0}
.pinfo{display:grid;grid-template-columns:56px minmax(0,1fr);gap:var(--s3);align-items:start}
.thumb{aspect-ratio:2/3;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);
  position:relative;overflow:hidden;display:block}
.thumb::after{content:attr(data-name);position:absolute;inset:0;display:grid;place-items:center;padding:3px;
  font-size:9px;color:#5d6570;text-align:center;overflow:hidden;line-height:1.35}
.thumb img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover}
.pname{font-size:13.5px;font-weight:600;line-height:1.4;margin-bottom:3px;overflow-wrap:anywhere}
.pmeta{font-size:11.5px;color:var(--text-3);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:var(--s3)}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 8px}
.stat b{display:block;font-size:13px;font-variant-numeric:tabular-nums;color:var(--text)}
.stat span{font-size:11px;color:var(--text-3)}
.line-list{display:grid;gap:5px}
.line-row{display:flex;align-items:center;gap:var(--s2);padding:6px 8px;border-radius:var(--r-sm);
  border:1px solid transparent;background:var(--surface-2);font-size:12.5px;color:var(--text-2);text-align:left;
  transition:border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease),background var(--dur-1) var(--ease)}
.line-row:hover{border-color:var(--line-2);color:var(--text)}
.line-row .lc{margin-left:auto;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.line-row[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.line-row[aria-pressed="true"] .lc{color:var(--primary);opacity:.8}

/* ── 页脚 / 固定徽标 ─────────────────── */
.foot{border-top:1px solid var(--line);margin-top:var(--s2)}
.foot-in{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;
  padding:var(--s5) 0 64px;font-size:12px;color:var(--text-3);line-height:1.7}
.foot-meta{font-variant-numeric:tabular-nums}
.back-link,.dir-badge{position:fixed;bottom:16px;z-index:60;font-size:12px;padding:5px 11px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);color:var(--text-2)}
.back-link{left:16px;transition:color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
.back-link:hover{color:var(--primary);border-color:var(--primary-line)}
.dir-badge{right:16px;color:var(--primary);border-color:var(--primary-line);background:var(--primary-soft);letter-spacing:.04em}

/* ── 响应式 ───────────────────────────── */
@media (max-width:1280px){
  .grid-6{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width:1080px){
  .nav{display:none}
  .main{grid-template-columns:minmax(0,1fr)}
  .side{position:static;grid-template-columns:1fr 1fr}
  .play-wrap{grid-template-columns:minmax(0,1fr)}
  .play-side{position:static;grid-template-columns:1fr 1fr;align-items:start}
  .grid-6{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:860px){
  .grid-6{grid-template-columns:repeat(4,minmax(0,1fr))}
  .detail{grid-template-columns:180px minmax(0,1fr);gap:var(--s5)}
  .dname{font-size:22px}
  .side{grid-template-columns:1fr}
  .play-side{grid-template-columns:1fr}
  .filterbar{gap:var(--s2) var(--s3)}
  .bar-row + .bar-row{padding-left:0;border-left:0}
}
@media (max-width:760px){
  .wrap{width:calc(100% - 32px)}
  .top-in{height:auto;flex-wrap:wrap;padding:8px 0;gap:8px var(--s3)}
  .logo{font-size:15.5px}
  .logo-mark{width:14px;height:14px}
  .search{order:2;width:auto;flex:1 1 140px;margin-left:0;height:32px}
  .search button{padding:0 12px}
  .seg{order:3;width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg [role="tab"]{flex:1 0 auto;text-align:center;padding:5px 8px}
  .filterbar{gap:var(--s2);padding-bottom:var(--s3)}
  .bar-row{width:100%;gap:var(--s2)}
  .bar-lbl{font-size:11.5px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;flex:1}
  .chips::-webkit-scrollbar{height:4px}
  .chips::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}
  .grid-6{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4) 10px}
  .block-hd{gap:6px}
  .block-hd .cnt{font-size:11px}
  .detail{grid-template-columns:minmax(0,1fr);gap:var(--s4)}
  .pcol{flex-direction:row;align-items:flex-end;gap:var(--s3)}
  .poster{width:132px;flex:none}
  .pside{flex-direction:column;align-items:flex-start;gap:2px}
  .dname{font-size:20px}
  .lines-row{flex-direction:column;gap:var(--s1)}
  .stage-play{width:48px;height:48px}
  .eps{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
  .pager{gap:4px}
  .pg{min-width:28px;height:28px;padding:0 7px;font-size:12px}
  .foot-in{padding-bottom:72px;flex-direction:column;align-items:flex-start;gap:var(--s1)}
  .back-link,.dir-badge{bottom:10px;font-size:11px;padding:4px 9px}
  .back-link{left:10px}
  .dir-badge{right:10px}
}
@media (max-width:420px){
  .grid-6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .detail .poster{width:118px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}
  .card:hover .art img{transform:none}
  .stage-play:active,.btn:active{transform:none}
  html{scroll-behavior:auto}
}
</style>

<script src="data.js"></script>
<script>
(function(){
  'use strict';
  var S = window.SITE || {};
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function $(sel, root){ return (root || document).querySelector(sel); }
  function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function pad2(n){ return String(n).padStart(2, '0'); }

  /* 数据清洗：年份只接受 1900–2030，剔除数据里的 22026 这类脏值 */
  function validYear(y){ y = Number(y); return isFinite(y) && y >= 1900 && y <= 2030; }

  var idCat = {};
  (S.categories || []).forEach(function(c){
    (S[c.alias] || []).forEach(function(it){ if (!idCat[it.id]) idCat[it.id] = c.n; });
  });

  var YEAR_CHIPS = Array.from(new Set(
    ['all','juji','dianying','zongyi','dongman']
      .reduce(function(acc, k){ return acc.concat((S[k] || []).map(function(i){ return Number(i.y); })); }, [])
      .filter(validYear)
  )).sort(function(a, b){ return b - a; }).slice(0, 5);

  var genreCount = {};
  (S.all || []).forEach(function(it){ genreCount[it.g] = (genreCount[it.g] || 0) + 1; });
  var GENRES = Object.keys(genreCount).sort(function(a, b){ return genreCount[b] - genreCount[a]; }).slice(0, 6);

  var state = {
    home: { cat: '', year: '', sort: 'new', genre: '' },
    list: { cat: '', year: '', sort: 'new', page: 1, genre: '' },
    q: '',
    detailLine: 0,
    playLine: 0,
    ep: (S.play && S.play.current) || 1,
    playing: false
  };

  /* ── 卡片 ───────────────────────────── */
  function cardHTML(it, i, stagger){
    var meta = [validYear(it.y) ? it.y : '', it.a].filter(Boolean).join(' · ');
    var style = stagger ? ' style="--i:' + Math.min(i, 15) + '"' : '';
    return '<a class="card" href="#detail" data-card="' + esc(it.id) + '" data-name="' + esc(it.n) + '"' + style + '>' +
      '<span class="art" data-name="' + esc(it.n) + '">' +
        '<img src="' + esc(it.c) + '" alt="" loading="lazy" decoding="async">' +
        (it.r ? '<span class="rm">' + esc(it.r) + '</span>' : '') +
      '</span>' +
      '<span class="cname">' + esc(it.n) + '</span>' +
      '<span class="cmeta">' + esc(meta) + '</span>' +
    '</a>';
  }

  function emptyHTML(scope, title, desc){
    return '<div class="empty">' +
      '<b>' + esc(title) + '</b>' +
      '<span>' + esc(desc) + '</span>' +
      '<button type="button" class="btn btn-ghost" data-reset="' + scope + '">清除筛选</button>' +
    '</div>';
  }

  var CAT_ALIAS = {};
  (S.categories || []).forEach(function(c){ CAT_ALIAS[c.n] = c.alias; });

  /* 分类 base：选了分类就取该类目自己的列表，否则用 all */
  function baseItems(scope){
    var st = state[scope];
    var alias = CAT_ALIAS[st.cat];
    return alias ? (S[alias] || []).slice() : (S.all || []).slice();
  }

  function applyFilters(items, st){
    return items.filter(function(it){
      if (st.genre && it.g !== st.genre) return false;
      if (st.year && Number(it.y) !== st.year) return false;
      return true;
    });
  }

  /* ── 筛选条 ─────────────────────────── */
  function chip(k, v, label, active){
    return '<button type="button" class="chip" data-k="' + k + '" data-v="' + esc(v) + '" aria-pressed="' + (active ? 'true' : 'false') + '">' + esc(label) + '</button>';
  }
  function barHTML(scope){
    var st = state[scope];
    var catChips = chip('cat', '', '全部', st.cat === '') +
      (S.categories || []).map(function(c){ return chip('cat', c.n, c.n, st.cat === c.n); }).join('');
    var yearChips = chip('year', '', '全部', st.year === '') +
      YEAR_CHIPS.map(function(y){ return chip('year', String(y), y, st.year === y); }).join('');
    var sortChips = chip('sort', 'new', '最新', st.sort === 'new') + chip('sort', 'hot', '最热', st.sort === 'hot');
    return '<div class="bar-row"><span class="bar-lbl">分类</span><div class="chips">' + catChips + '</div></div>' +
      '<div class="bar-row"><span class="bar-lbl">年份</span><div class="chips">' + yearChips + '</div></div>' +
      '<div class="bar-row"><span class="bar-lbl">排序</span><div class="chips">' + sortChips + '</div></div>';
  }

  /* ── 首页 ───────────────────────────── */
  function renderHome(){
    var base = baseItems('home').slice(0, 24);
    var items = applyFilters(base, state.home);
    var grid = $('#grid-home');
    grid.innerHTML = items.length ? items.map(function(it, i){ return cardHTML(it, i, true); }).join('')
      : emptyHTML('home', '该筛选下暂无内容', '首页只取前 24 部，换个分类或年份试试。');
    $('#homeCount').textContent = '本区 ' + items.length + ' 部';
    var note = $('#note-home');
    note.hidden = state.home.sort !== 'hot';
    note.textContent = state.home.sort === 'hot'
      ? '「最热」需要接口返回热度字段，本原型无该数据，网格仍按收录顺序排列。' : '';

    $('#grid-today').innerHTML = (S.today || []).map(function(it, i){ return cardHTML(it, i, true); }).join('');
    $('#todayCount').textContent = (S.today || []).length + ' 部';
    $('#bar-home').innerHTML = barHTML('home');
  }

  /* ── 列表 ───────────────────────────── */
  function renderList(){
    var items = applyFilters(baseItems('list'), state.list);
    if (state.q) {
      var q = state.q;
      items = items.filter(function(it){
        var d = (S.desc && S.desc[it.id]) || {};
        return String(it.n).indexOf(q) > -1 || String(d.actor || '').indexOf(q) > -1 || String(d.director || '').indexOf(q) > -1;
      });
    }
    $('#grid-list').innerHTML = items.length ? items.map(function(it, i){ return cardHTML(it, i, true); }).join('')
      : emptyHTML('list', state.q ? '没有匹配「' + state.q + '」的影片' : '该筛选下暂无内容', state.q ? '换个关键词，或清除筛选查看全部在库影片。' : '换个分类或年份试试。');

    $('#listTitle').textContent = state.q ? '搜索「' + state.q + '」'
      : (state.list.genre || state.list.cat || '全部影片');
    $('#listCount').innerHTML = '在库 <b>' + Number(S.total || 0).toLocaleString() + '</b> 部 · 当前显示 <b>' + items.length + '</b> 部';
    $('#bar-list').innerHTML = barHTML('list');

    var note = $('#note-list');
    note.hidden = state.list.sort !== 'hot';
    note.textContent = state.list.sort === 'hot'
      ? '「最热」需要接口返回热度字段，本原型无该数据，网格仍按收录顺序排列。' : '';

    renderPager();
  }

  function renderPager(){
    var cur = state.list.page;
    var pages = [2, 3, 4, 5];
    var html = '<button type="button" class="pg" data-page="' + (cur - 1) + '"' +
      (cur === 1 ? ' aria-disabled="true"' : '') + ' aria-label="上一页">‹</button>';
    html += '<button type="button" class="pg" data-page="1"' + (cur === 1 ? ' aria-current="page" aria-disabled="true"' : '') + '>1</button>';
    pages.forEach(function(p){
      html += '<button type="button" class="pg" data-page="' + p + '"' + (cur === p ? ' aria-current="page" aria-disabled="true"' : '') + '>' + p + '</button>';
    });
    html += '<span class="pg dots">…</span>';
    html += '<button type="button" class="pg" data-page="5187"' + (cur === 5187 ? ' aria-current="page" aria-disabled="true"' : '') + '>5187</button>';
    html += '<button type="button" class="pg" data-page="' + (cur + 1) + '" aria-label="下一页">›</button>';
    $('#pager').innerHTML = html;
    $('#pagerNote').hidden = cur === 1;
  }

  /* ── 侧栏 ───────────────────────────── */
  function sideHTML(){
    var rank = ((S.juji || []).concat(S.dianying || [])).slice(0, 10).map(function(it, i){
      return '<a class="rk" href="#detail" data-card="' + esc(it.id) + '" data-name="' + esc(it.n) + '">' +
        '<span class="no">' + pad2(i + 1) + '</span>' +
        '<span class="nm">' + esc(it.n) + '</span>' +
        '<span class="x">' + esc(it.r || it.a || '') + '</span>' +
      '</a>';
    }).join('');

    var mini = (S.juji || []).slice(0, 6).map(function(it){
      return '<a href="#detail" data-card="' + esc(it.id) + '" title="' + esc(it.n) + '">' +
        '<span class="art" data-name="' + esc(it.n) + '"><img src="' + esc(it.c) + '" alt="" loading="lazy" decoding="async"></span>' +
        '<span class="t">' + esc(it.n) + '</span>' +
      '</a>';
    }).join('');

    var catLinks = (S.categories || []).map(function(c){
      return '<button type="button" data-cat="' + esc(c.n) + '">' + esc(c.n) + '</button>';
    }).join('') + GENRES.slice(0, 6).map(function(g){
      return '<button type="button" data-genre="' + esc(g) + '">' + esc(g) + '</button>';
    }).join('');

    return '<div class="panel">' +
        '<div class="panel-hd"><h3>热播榜</h3><span class="n">演示排序</span></div>' +
        '<div class="rank">' + rank + '</div>' +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-hd"><h3>剧集连更</h3><span class="n">更新至最新</span></div>' +
        '<div class="mini">' + mini + '</div>' +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-hd"><h3>分类直达</h3><span class="n">' + ((S.categories || []).length + Math.min(6, GENRES.length)) + ' 个入口</span></div>' +
        '<div class="cat-links">' + catLinks + '</div>' +
      '</div>';
  }

  /* ── 详情 ───────────────────────────── */
  function renderDetail(){
    var d = S.detailTv || {};
    var v = d.vod || {};
    var catName = idCat[v.id] || v.g || '影片';
    $('#crumbs').innerHTML = '<a href="#home" data-go="home">首页</a><i>›</i>' +
      '<a href="#list" data-go="list">' + esc(catName) + '</a><i>›</i><span>' + esc(v.n) + '</span>' +
      '<span class="note-inline" id="detailNote" hidden>原型演示：任意卡片都打开这份示例详情</span>';

    var tags = [v.g, validYear(v.y) ? String(v.y) : '', v.a, v.r, v.e ? '共 ' + v.e + ' 集' : ''].filter(Boolean);
    var tagHTML = tags.map(function(t, i){
      return '<span class="tag' + (i === 3 ? ' hot' : '') + '">' + esc(t) + '</span>';
    }).join('');

    var lines = d.lines || [];
    var linePills = lines.map(function(l, i){
      return '<button type="button" class="line-pill" data-line="' + i + '" aria-pressed="' + (i === state.detailLine ? 'true' : 'false') + '">' +
        esc(l.name) + '<span>' + esc(l.episodes) + ' 集</span></button>';
    }).join('');
    var cur = lines[state.detailLine] || lines[0] || {};

    $('#detail').innerHTML =
      '<div class="detail">' +
        '<div class="pcol">' +
          '<span class="poster art" data-name="' + esc(v.n) + '"><img src="' + esc(v.c) + '" alt="' + esc(v.n) + ' 海报" decoding="async"></span>' +
          '<div class="pside"><span>线路 ' + lines.length + ' 条</span><span>' + esc(v.lang || '') + '</span></div>' +
        '</div>' +
        '<div class="dinfo">' +
          '<div class="dmeta">' + tagHTML + '</div>' +
          '<h1 class="dname">' + esc(v.n) + '</h1>' +
          '<dl class="facts">' +
            '<div><dt>导演</dt><dd>' + esc(v.director || '—') + '</dd></div>' +
            '<div><dt>主演</dt><dd class="clamp2">' + esc(v.actor || '—') + '</dd></div>' +
            '<div><dt>语言</dt><dd>' + esc(v.lang || '—') + '</dd></div>' +
            '<div><dt>首播</dt><dd>' + esc(v.releaseDate || v.y || '—') + '</dd></div>' +
          '</dl>' +
          '<div class="lines-row"><span class="bar-lbl">线路</span><div class="line-pills">' + linePills + '</div></div>' +
          '<div class="actions">' +
            '<button type="button" class="btn btn-primary" id="playNow">' +
              '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>立即播放' +
            '</button>' +
            '<span class="actions-note" id="lineStat">当前线路：' + esc(cur.name || '') + ' · ' + esc(cur.episodes || 0) + ' 集</span>' +
          '</div>' +
          '<h2 class="syn-hd">简介</h2>' +
          '<p class="syn" id="syn">' + esc(v.content || '暂无简介') + '</p>' +
          '<button type="button" class="linkbtn" id="synToggle" aria-expanded="false" aria-controls="syn" hidden>展开全部</button>' +
        '</div>' +
      '</div>';

    var syn = $('#syn');
    var toggle = $('#synToggle');
    if (syn.scrollHeight > syn.clientHeight + 4) toggle.hidden = false;

    $('#relatedCount').textContent = (d.related || []).length + ' 部';
    $('#grid-related').innerHTML = (d.related || []).map(function(it, i){ return cardHTML(it, i, true); }).join('');
    $('#detailNote').hidden = !state.viaCard;
  }

  /* ── 播放 ───────────────────────────── */
  function renderPlay(){
    var p = S.play || {};
    var vod = p.vod || {};
    var lines = p.lines || [];
    var eps = p.episodes || [];
    var line = lines[state.playLine] || lines[0] || {};
    var ep = eps.filter(function(e){ return e.index === state.ep; })[0] || eps[0] || { index: 0, name: '—' };
    var pv = (S.detailTv && S.detailTv.vod) || {};
    var metaLine = [pv.g, validYear(pv.y) ? pv.y : ''].filter(Boolean).join(' · ');

    $('#playTitle').textContent = vod.name || '播放';
    $('#playRemark').textContent = vod.remarks || '';
    $('#stageBadge').textContent = '线路 · ' + (line.name || '未选线路');
    $('#stage').classList.toggle('is-playing', state.playing);
    if (state.playing) {
      $('#stageHint').innerHTML = '已模拟播放 <b>' + esc(ep.name) + '</b> · 占位播放器，无真实视频源';
    }

    $('#epHead').textContent = line.name + ' · 共 ' + eps.length + ' 集 · 当前 ' + ep.name;
    $('#eps').innerHTML = eps.map(function(e){
      return '<button type="button" class="ep" data-ep="' + e.index + '" aria-pressed="' + (e.index === state.ep ? 'true' : 'false') + '"' +
        (e.index === state.ep ? ' aria-current="true"' : '') + '>' + pad2(e.index) + '</button>';
    }).join('');
    $('#lineNote').hidden = state.playLine === 0;
    $('#lineNote').textContent = state.playLine === 0 ? '' :
      '演示数据只包含「' + (lines[0] ? lines[0].name : '') + '」的分集列表；切换线路只演示状态，不改动选集。';

    $('#playInfo').innerHTML =
      '<div class="panel-hd"><h3>剧集信息</h3><span class="n">' + esc(vod.remarks || '') + '</span></div>' +
      '<div class="pinfo">' +
        '<span class="thumb art" data-name="' + esc(vod.name) + '"><img src="' + esc(vod.cover) + '" alt="" loading="lazy" decoding="async"></span>' +
        '<div>' +
          '<div class="pname">' + esc(vod.name || '') + '</div>' +
          '<div class="pmeta">' + esc(metaLine) + '</div>' +
          '<div class="pmeta">' + esc(line.name || '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="pstats">' +
        '<div class="stat"><b>' + lines.length + '</b><span>可用线路</span></div>' +
        '<div class="stat"><b>' + eps.length + '</b><span>本线路集数</span></div>' +
      '</div>';

    $('#playLines').innerHTML =
      '<div class="panel-hd"><h3>线路切换</h3><span class="n">' + lines.length + ' 条</span></div>' +
      '<div class="line-list">' + lines.map(function(l, i){
        return '<button type="button" class="line-row" data-playline="' + i + '" aria-pressed="' + (i === state.playLine ? 'true' : 'false') + '">' +
          esc(l.name) + '<span class="lc">' + esc(l.episodes) + ' 集</span></button>';
      }).join('') + '</div>';
  }

  /* ── 视图切换 ───────────────────────── */
  function switchView(view, opts){
    opts = opts || {};
    $$('.view').forEach(function(sec){ sec.hidden = sec.id !== 'view-' + view; });
    $$('#seg [role="tab"]').forEach(function(t){
      var on = t.getAttribute('data-view') === view;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.setAttribute('tabindex', on ? '0' : '-1');
    });
    if (view === 'home') renderHome();
    if (view === 'list') renderList();
    if (view === 'detail') renderDetail();
    if (view === 'play') renderPlay();
    document.body.setAttribute('data-view', view);
    try { history.replaceState(null, '', '#' + view); } catch (err) { /* file:// 下可能禁止改 URL，忽略 */ }
    if (opts.scroll !== false) window.scrollTo({ top: 0, behavior: (reduceMotion || !opts.smooth) ? 'auto' : 'smooth' });
    if (opts.focus) {
      var h = $('#view-' + view + ' [data-view-title]');
      if (h) h.focus({ preventScroll: true });
    }
  }

  /* ── 事件 ───────────────────────────── */
  // 分段控件
  $('#seg').addEventListener('click', function(e){
    var tab = e.target.closest('[role="tab"]');
    if (!tab) return;
    state.viaCard = false;
    switchView(tab.getAttribute('data-view'));
  });
  $('#seg').addEventListener('keydown', function(e){
    var tabs = $$('#seg [role="tab"]');
    var idx = tabs.indexOf(document.activeElement);
    if (idx < 0) return;
    var next = null;
    if (e.key === 'ArrowRight') next = (idx + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') next = (idx - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = tabs.length - 1;
    if (next === null) return;
    e.preventDefault();
    tabs[next].focus();
    switchView(tabs[next].getAttribute('data-view'), { focus: false });
  });

  // data-go 链接 / 按钮
  document.addEventListener('click', function(e){
    var go = e.target.closest('[data-go]');
    if (go) { e.preventDefault(); state.viaCard = false; switchView(go.getAttribute('data-go')); return; }

    var card = e.target.closest('[data-card]');
    if (card) {
      e.preventDefault();
      state.viaCard = true;
      switchView('detail');
      return;
    }

    var reset = e.target.closest('[data-reset]');
    if (reset) {
      var scope = reset.getAttribute('data-reset');
      state[scope].cat = ''; state[scope].year = ''; state[scope].sort = 'new'; state[scope].genre = '';
      if (scope === 'list') { state.q = ''; $('#q').value = ''; state.list.page = 1; renderList(); }
      if (scope === 'home') renderHome();
      return;
    }

    var genBtn = e.target.closest('[data-genre]');
    if (genBtn) {
      e.preventDefault();
      state.list.genre = genBtn.getAttribute('data-genre');
      state.list.cat = ''; state.list.year = ''; state.list.sort = 'new'; state.list.page = 1;
      state.q = ''; $('#q').value = '';
      switchView('list');
      return;
    }

    var catBtn = e.target.closest('.cat-links button, .navbtn');
    if (catBtn) {
      e.preventDefault();
      var c = catBtn.getAttribute('data-cat') || '';
      state.list.cat = c; state.list.genre = ''; state.list.year = ''; state.list.sort = 'new'; state.list.page = 1;
      state.q = ''; $('#q').value = '';
      switchView('list');
      return;
    }

    var pg = e.target.closest('[data-page]');
    if (pg && !pg.getAttribute('aria-disabled')) {
      state.list.page = Number(pg.getAttribute('data-page'));
      renderPager();
    }
  });

  // 筛选 chips（容器重新渲染，事件挂在容器上）
  ['#bar-home', '#bar-list'].forEach(function(sel){
    $(sel).addEventListener('click', function(e){
      var c = e.target.closest('.chip');
      if (!c) return;
      var scope = sel === '#bar-home' ? 'home' : 'list';
      var k = c.getAttribute('data-k');
      var v = c.getAttribute('data-v');
      if (k === 'year') v = v ? Number(v) : '';
      if (k === 'cat') state[scope].genre = '';
      state[scope][k] = v;
      if (scope === 'list' && k !== 'sort') state.list.page = 1;
      if (scope === 'home') renderHome(); else renderList();
    });
  });

  // 搜索
  $('#searchForm').addEventListener('submit', function(e){
    e.preventDefault();
    var q = $('#q').value.trim();
    if (!q) {
      state.q = '';
      state.list.page = 1;
      switchView('list');
      return;
    }
    state.q = q;
    state.list.page = 1;
    switchView('list');
    $('#listTitle').focus({ preventScroll: true });
  });

  // 详情：线路切换 / 简介展开 / 立即播放
  $('#view-detail').addEventListener('click', function(e){
    if (e.target.closest('#playNow')) {
      state.playLine = state.detailLine;
      state.playing = false;
      switchView('play');
      return;
    }
    var pill = e.target.closest('.line-pill');
    if (pill) {
      state.detailLine = Number(pill.getAttribute('data-line'));
      $$('.line-pill', $('#view-detail')).forEach(function(p){
        p.setAttribute('aria-pressed', p === pill ? 'true' : 'false');
      });
      var d = S.detailTv || {};
      var l = (d.lines || [])[state.detailLine] || {};
      $('#lineStat').textContent = '当前线路：' + (l.name || '') + ' · ' + (l.episodes || 0) + ' 集';
      return;
    }
    if (e.target.closest('#synToggle')) {
      var syn = $('#syn');
      var open = syn.classList.toggle('is-open');
      var btn = $('#synToggle');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.textContent = open ? '收起' : '展开全部';
      return;
    }
  });

  // 播放：选集、线路、播放按钮
  $('#view-play').addEventListener('click', function(e){
    var ep = e.target.closest('[data-ep]');
    if (ep) {
      state.ep = Number(ep.getAttribute('data-ep'));
      state.playing = true;
      renderPlay();
      return;
    }
    var line = e.target.closest('[data-playline]');
    if (line) {
      state.playLine = Number(line.getAttribute('data-playline'));
      renderPlay();
      return;
    }
    if (e.target.closest('#stagePlay')) {
      state.playing = true;
      renderPlay();
    }
  });

  // 图片加载失败 → 隐藏图片，露出 .art::after 的片名兜底
  document.addEventListener('error', function(e){
    var t = e.target;
    if (t && t.tagName === 'IMG') t.style.visibility = 'hidden';
  }, true);

  // 顶栏分类导航
  $('#navCats').innerHTML =
    '<button type="button" class="navbtn" data-cat="" aria-current="true">全部片库</button>' +
    (S.categories || []).map(function(c){
      return '<button type="button" class="navbtn" data-cat="' + esc(c.n) + '">' + esc(c.n) + '</button>';
    }).join('');

  // 初始化
  $('#total').textContent = Number(S.total || 0).toLocaleString();
  $$('#side-home, #side-list').forEach(function(el){ el.innerHTML = sideHTML(); });

  var initial = (location.hash || '#home').replace('#', '');
  if (['home', 'list', 'detail', 'play'].indexOf(initial) < 0) initial = 'home';
  state.viaCard = false;
  switchView(initial, { scroll: false, smooth: false });
})();
</script>
</body>
</html>
