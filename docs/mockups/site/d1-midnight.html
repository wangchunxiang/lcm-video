<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D1 · 深夜影院（整站）</title>
<style>
:root{
  --bg:#0a0c0f;--bg-2:#0d1015;--surface:#14171d;--surface-2:#1a1f27;--line:rgba(255,255,255,.08);
  --ink:#e9ecf1;--ink-2:#a4acb8;--ink-3:#79818d;
  --primary:#3b82f6;--primary-strong:#2563eb;--primary-weak:rgba(59,130,246,.15);--primary-line:rgba(59,130,246,.45);
  --r:10px;--r-sm:6px;--wrap:min(1600px,100% - 96px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block}
h1,h2,h3,p{margin:0}
.wrap{width:var(--wrap);margin:0 auto}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:60;background:rgba(10,12,15,.78);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:30px;height:68px}
.logo{font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;flex:none}
.logo i{width:8px;height:20px;border-radius:3px;background:linear-gradient(180deg,#60a5fa,#2563eb)}
.nav{display:flex;gap:24px;font-size:14.5px;color:var(--ink-2)}
.nav a{padding:6px 0;border-bottom:2px solid transparent;transition:.18s}
.nav a:hover{color:#fff}
.nav a.on{color:#fff;border-color:var(--primary)}
.grow{flex:1}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);width:230px;color:var(--ink-3);flex:none}
.search input{flex:1;min-width:0;border:0;background:0;outline:0;color:var(--ink);font-size:13.5px}
.switch{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);flex:none}
.switch button{border:0;background:0;cursor:pointer;color:var(--ink-2);font-size:12.5px;padding:5px 12px;border-radius:999px;transition:.16s}
.switch button:hover{color:#fff}
.switch button.on{background:var(--primary);color:#fff;font-weight:600}

/* ---------- 视图 1：首页 hero ---------- */
.hero{position:relative;height:min(600px,68vh);overflow:hidden;border-bottom:1px solid var(--line)}
.hero-bg,.hero-blur{position:absolute;inset:0;background-size:cover;background-position:50% 28%;transition:opacity .7s ease}
.hero-blur{inset:-10%;filter:blur(64px) brightness(.45) saturate(130%);transform:scale(1.1)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,var(--bg) 3%,rgba(10,12,15,.85) 36%,rgba(10,12,15,.28) 66%,rgba(10,12,15,.05) 88%),
             linear-gradient(0deg,var(--bg) 0%,rgba(10,12,15,0) 48%)}
.hero-in{position:absolute;left:0;right:0;bottom:52px;z-index:2}
.hero-in .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.hero-txt{max-width:620px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8fb6ff;margin-bottom:14px}
.kicker span{width:24px;height:1px;background:currentColor;opacity:.7}
.hero h1{font-size:clamp(34px,4vw,58px);line-height:1.06;letter-spacing:-.025em;font-weight:800;margin-bottom:14px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--ink-2);font-size:13.5px}
.meta b{color:var(--ink);font-weight:600}
.meta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3)}
.tag{padding:2px 9px;border-radius:5px;font-size:12px;background:rgba(255,255,255,.09);color:#cdd4de}
.hero p.desc{margin:16px 0 24px;color:#b9c1cc;font-size:14px;line-height:1.8;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;gap:10px}
.btn{height:44px;padding:0 24px;border-radius:var(--r-sm);display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;border:1px solid transparent;transition:.18s}
.btn-play{background:var(--primary);color:#fff;box-shadow:0 10px 26px -12px rgba(59,130,246,.9)}
.btn-play:hover{background:var(--primary-strong)}
.btn-ghost{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ink)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px;padding-bottom:6px}
.bullets{display:flex;gap:6px}
.bullets i{width:24px;height:3px;border-radius:2px;background:rgba(255,255,255,.22);cursor:pointer;transition:.2s}
.bullets i.on{width:36px;background:#fff}
.idx{font-size:12.5px;letter-spacing:.1em;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- 卡片 ---------- */
.wall{display:grid;gap:22px 18px}
.wall.c8{grid-template-columns:repeat(8,1fr)}
.wall.c6{grid-template-columns:repeat(6,1fr)}
.wall.c4{grid-template-columns:repeat(4,1fr)}
.card{display:flex;flex-direction:column;gap:9px;min-width:0}
.art{position:relative;aspect-ratio:2/3;border-radius:var(--r-sm);overflow:hidden;background:var(--surface);
  transition:transform .22s ease,box-shadow .22s ease}
.art::after{content:attr(data-name);position:absolute;inset:0;display:grid;place-items:center;padding:12px;
  font-size:12.5px;line-height:1.5;color:#6d7683;text-align:center}
.art img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .art{transform:translateY(-5px);box-shadow:0 20px 40px -18px #000,0 0 0 1px var(--primary-line)}
.card:hover .art img{transform:scale(1.06)}
.badge{position:absolute;z-index:2;top:7px;right:7px;padding:1px 7px;border-radius:4px;font-size:11.5px;
  background:rgba(10,12,15,.78);border:1px solid rgba(255,255,255,.12);color:#dfe5ee;backdrop-filter:blur(6px)}
.playmask{position:absolute;z-index:3;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s;
  background:linear-gradient(0deg,rgba(10,12,15,.78),rgba(10,12,15,.12))}
.card:hover .playmask{opacity:1}
.playmask i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(59,130,246,.95);color:#fff;font-size:14px;font-style:normal}
.cap{display:flex;flex-direction:column;gap:3px;min-width:0}
.cap .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:hover .cap .t{color:#93b9ff}
.cap .m{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 区块 / rail ---------- */
.view{padding:0}
.block{padding:44px 0}
.block-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.block-hd h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.block-hd .sub{font-size:12.5px;color:var(--ink-3)}
.block-hd .more{margin-left:auto;font-size:13px;color:var(--ink-2);display:inline-flex;gap:4px;align-items:center}
.block-hd .more:hover{color:var(--primary)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:196px;gap:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.hero-rail{padding-top:40px}

/* ---------- 视图 2：列表 ---------- */
.list-layout{display:grid;grid-template-columns:212px minmax(0,1fr);gap:34px;padding:34px 0 60px;align-items:start}
.side-nav{position:sticky;top:88px;display:flex;flex-direction:column;gap:2px}
.side-nav .hd{font-size:11.5px;letter-spacing:.16em;color:var(--ink-3);margin:0 0 10px 10px}
.side-nav a{padding:8px 10px;border-radius:6px;font-size:14px;color:var(--ink-2);display:flex;justify-content:space-between;transition:.16s}
.side-nav a:hover{background:var(--surface);color:var(--ink)}
.side-nav a.on{background:var(--primary-weak);color:#9cc2ff;font-weight:600}
.side-nav a em{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.bar .lbl{font-size:12px;letter-spacing:.1em;color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:5px;font-size:12.5px;color:var(--ink-2);border:1px solid var(--line);transition:.16s}
.chip:hover{border-color:var(--primary-line);color:var(--ink)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:32px}
.pager a{min-width:32px;height:32px;padding:0 9px;display:grid;place-items:center;border-radius:5px;
  border:1px solid var(--line);font-size:13px;color:var(--ink-2);transition:.16s}
.pager a:hover{border-color:var(--primary-line);color:var(--ink)}
.pager a.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}

/* ---------- 视图 3：详情 ---------- */
.banner{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.banner-bg{position:absolute;inset:-8%;background-size:cover;background-position:50% 22%;filter:blur(46px) brightness(.32) saturate(120%);transform:scale(1.12)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 2%,rgba(10,12,15,.55) 45%,rgba(10,12,15,.75) 100%)}
.banner-in{position:relative;z-index:2;display:flex;gap:36px;padding:150px 0 44px;align-items:flex-end}
.poster{width:236px;flex:none;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--surface);
  box-shadow:0 28px 60px -24px #000,0 0 0 1px rgba(255,255,255,.1)}
.poster img{width:100%;height:100%;object-fit:cover}
.b-info{flex:1;min-width:0;padding-bottom:4px}
.b-info h1{font-size:clamp(26px,2.6vw,40px);line-height:1.14;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.facts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.facts .tag{background:var(--primary-weak);color:#9cc2ff}
.credits{font-size:13px;color:var(--ink-2);line-height:1.9;margin-bottom:18px;max-width:820px}
.credits b{color:var(--ink-3);font-weight:500;margin-right:6px}
.lines{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.line-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2);cursor:pointer;transition:.16s}
.line-btn:hover{border-color:var(--primary-line);color:var(--ink)}
.line-btn.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.line-btn em{font-style:normal;font-size:11.5px;opacity:.8}
.detail-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;padding:40px 0 56px;align-items:start}
.sect-t{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.sect-t::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--primary)}
.prose{color:#c2c9d4;font-size:14px;line-height:2;white-space:pre-line}
.eps{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.eps a{height:36px;display:grid;place-items:center;border-radius:5px;border:1px solid var(--line);
  background:var(--surface);font-size:12.5px;color:var(--ink-2);transition:.16s}
.eps a:hover{border-color:var(--primary-line);color:#fff}
.eps a.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.aside-card{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.kv:last-child{border:0}
.kv span{color:var(--ink-3)}
.kv b{font-weight:500;color:var(--ink);text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 视图 4：播放 ---------- */
.play-wrap{padding:18px 0 50px}
.play-top{display:flex;align-items:center;gap:12px;padding:6px 0 16px;font-size:13px;color:var(--ink-3)}
.play-top .back:hover{color:var(--primary)}
.play-top b{color:var(--ink-2);font-weight:500}
.play-grid{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:22px;align-items:start}
.player{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--line)}
.player .bgv{position:absolute;inset:0;background-size:cover;background-position:50% 30%;opacity:.22;filter:blur(14px)}
.player .ctrl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:18px}
.player .pt{display:flex;align-items:center;gap:10px;font-size:13px;color:#cfd6e0}
.player .pt em{font-style:normal;padding:1px 8px;border-radius:4px;background:rgba(255,255,255,.14);font-size:11.5px}
.player .big{position:absolute;inset:0;display:grid;place-items:center}
.player .big i{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  background:rgba(59,130,246,.94);color:#fff;font-size:24px;font-style:normal;box-shadow:0 16px 40px -12px #000;cursor:pointer}
.player .pb{display:flex;align-items:center;gap:12px;font-size:12px;color:#aab3c0}
.player .track{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);position:relative}
.player .track i{position:absolute;inset:0 72% 0 0;background:var(--primary);border-radius:2px}
.player .track i::after{content:"";position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:#fff}
.play-side{display:flex;flex-direction:column;gap:16px}
.side-box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.side-box .hd{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.side-box .hd .n{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:400}
.ep-list{max-height:364px;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.ep-list a{background:var(--surface);padding:10px 0;text-align:center;font-size:12.5px;color:var(--ink-2);transition:.14s}
.ep-list a:hover{background:var(--surface-2);color:#fff}
.ep-list a.on{background:var(--primary);color:#fff;font-weight:600}
.line-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.line-row:last-child{border:0}
.line-row.on{color:#9cc2ff;background:var(--primary-weak)}
.line-row .cnt{margin-left:auto;font-size:11.5px;color:var(--ink-3)}

/* ---------- 页脚 / 徽标 ---------- */
.foot{border-top:1px solid var(--line);padding:30px 0 60px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.pick{position:fixed;right:16px;bottom:16px;z-index:99;font-size:12px;letter-spacing:.06em;padding:7px 13px;border-radius:999px;
  background:var(--primary-weak);color:#a9c9ff;border:1px solid var(--primary-line);backdrop-filter:blur(10px)}
.backall{position:fixed;left:16px;bottom:16px;z-index:99;font-size:12px;padding:7px 13px;border-radius:999px;
  background:rgba(20,23,29,.9);border:1px solid var(--line);color:var(--ink-2);backdrop-filter:blur(10px)}
.backall:hover{color:#fff}

@media (max-width:1280px){
  .nav{display:none}
  .top .wrap{gap:14px}
}
@media (max-width:900px){
  .search{display:none}
}
@media (max-width:1100px){
  :root{--wrap:calc(100% - 48px)}
  .wall.c8,.wall.c6{grid-template-columns:repeat(4,1fr)}
  .list-layout{grid-template-columns:1fr}
  .side-nav{position:static;flex-direction:row;overflow:auto;gap:6px}
  .side-nav .hd{display:none}
  .detail-body,.play-grid{grid-template-columns:1fr}
  .banner-in{padding:100px 0 30px;gap:22px}
  .poster{width:150px}
  .eps{grid-template-columns:repeat(5,1fr)}
}
@media (max-width:640px){
  :root{--wrap:calc(100% - 28px)}
  .top .wrap{height:56px;gap:12px;flex-wrap:wrap}
  .nav,.search{display:none}
  .wall.c8,.wall.c6,.wall.c4{grid-template-columns:repeat(3,1fr);gap:14px 10px}
  .hero{height:min(440px,62vh)}
  .banner-in{flex-direction:column;align-items:flex-start;gap:16px}
  .eps{grid-template-columns:repeat(4,1fr)}
  .rail{grid-auto-columns:132px}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#"><i></i>蓝草莓影视</a>
    <nav class="nav">
      <a class="on" href="#">首页</a><a href="#">电影</a><a href="#">剧集</a><a href="#">综艺</a><a href="#">动漫</a>
    </nav>
    <span class="grow"></span>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input placeholder="搜索片名、演员">
    </label>
    <div class="switch" id="switch">
      <button data-view="home" class="on">首页</button>
      <button data-view="list">列表</button>
      <button data-view="detail">详情</button>
      <button data-view="play">播放</button>
    </div>
  </div>
</header>

<!-- ============ 首页 ============ -->
<section class="view" data-view="home">
  <div class="hero" id="hero">
    <div class="hero-blur" id="heroBlur"></div>
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-in">
      <div class="wrap">
        <div class="hero-txt">
          <div class="kicker"><span></span><em style="font-style:normal" id="hKick"></em></div>
          <h1 id="hTitle"></h1>
          <div class="meta" id="hMeta"></div>
          <p class="desc" id="hDesc"></p>
          <div class="actions">
            <a class="btn btn-play" href="#" id="hPlay">▶ 立即播放</a>
            <a class="btn btn-ghost" href="#" data-go="detail">查看详情</a>
          </div>
        </div>
        <div class="hero-side">
          <div class="bullets" id="hDots"></div>
          <div class="idx" id="hIdx"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="block hero-rail">
      <div class="block-hd"><h2>今日更新</h2><span class="sub" id="todayN"></span><a class="more" href="#">全部新片 ›</a></div>
      <div class="rail" id="railToday"></div>
    </div>
    <div class="block">
      <div class="block-hd"><h2>电影</h2><span class="sub">院线新片与热播</span><a class="more" href="#" data-go="list">更多 ›</a></div>
      <div class="rail" id="railMovie"></div>
    </div>
    <div class="block">
      <div class="block-hd"><h2>剧集</h2><span class="sub">每晚两集，连更不落</span><a class="more" href="#" data-go="list">更多 ›</a></div>
      <div class="rail" id="railTv"></div>
    </div>
    <div class="block">
      <div class="block-hd"><h2>正在热播</h2><span class="sub">在库 <b id="totalN" style="color:var(--ink-2);font-weight:500"></b> 部</span><a class="more" href="#" data-go="list">进入片库 ›</a></div>
      <div class="wall c8" id="wallAll"></div>
    </div>
  </div>
</section>

<!-- ============ 列表 ============ -->
<section class="view" data-view="list" hidden>
  <div class="wrap">
    <div class="list-layout">
      <aside class="side-nav" id="sideNav"></aside>
      <div>
        <div class="bar">
          <span class="lbl">分类</span>
          <div class="chips" id="chipsCat"></div>
          <span class="lbl">年份</span>
          <div class="chips" id="chipsYear"></div>
          <span class="lbl">排序</span>
          <div class="chips" id="chipsSort"></div>
        </div>
        <div class="wall c6" id="wallList"></div>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ 详情 ============ -->
<section class="view" data-view="detail" hidden>
  <div class="banner" id="banner">
    <div class="banner-bg" id="bannerBg"></div>
    <div class="wrap">
      <div class="banner-in">
        <div class="poster" id="dPoster"></div>
        <div class="b-info">
          <h1 id="dTitle"></h1>
          <div class="facts" id="dFacts"></div>
          <div class="credits" id="dCredits"></div>
          <div class="lines" id="dLines"></div>
          <div class="actions">
            <a class="btn btn-play" href="#" data-go="play">▶ 第 01 集</a>
            <a class="btn btn-ghost" href="#" id="dCollect">＋ 收藏</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="detail-body">
      <div>
        <div class="sect-t">剧情简介</div>
        <p class="prose" id="dContent"></p>
        <div class="sect-t" style="margin-top:34px">选集播放</div>
        <div class="eps" id="dEps"></div>
        <div class="sect-t" style="margin-top:38px">相关推荐</div>
        <div class="wall c6" id="dRelated"></div>
      </div>
      <aside class="aside-card" id="dAside"></aside>
    </div>
  </div>
</section>

<!-- ============ 播放 ============ -->
<section class="view" data-view="play" hidden>
  <div class="wrap">
    <div class="play-wrap">
      <div class="play-top">
        <a class="back" href="#" data-go="detail">‹ 返回详情</a>
        <span>/</span><b id="pCrumb"></b>
      </div>
      <div class="play-grid">
        <div>
          <div class="player">
            <div class="bgv" id="pBg"></div>
            <div class="ctrl">
              <div class="pt"><em id="pLine">三六资源</em><span id="pName"></span></div>
              <div class="pb">
                <span id="pTime">00:00 / 45:00</span>
                <span class="track"><i></i></span>
                <span>⚙ 高清</span><span>⛶ 全屏</span>
              </div>
            </div>
            <div class="big"><i>▶</i></div>
          </div>
          <div class="side-box" style="margin-top:16px">
            <div class="hd">选集<span class="n" id="pEpN"></span></div>
            <div class="ep-list" id="pEpsHome"></div>
          </div>
        </div>
        <aside class="play-side">
          <div class="side-box">
            <div class="hd">播放线路<span class="n" id="pLineN"></span></div>
            <div id="pLines"></div>
          </div>
          <div class="side-box" id="pInfo"></div>
        </aside>
      </div>
    </div>
  </div>
</section>

<footer class="foot">
  <div class="wrap" style="display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap">
    <span>本站所有内容均收集自互联网，仅供学习交流，请勿用于商业用途。</span>
    <span>D1 · 深夜影院</span>
  </div>
</footer>

<a class="backall" href="index.html">← 全部方案</a>
<div class="pick">D1 · 深夜影院</div>

<script src="data.js"></script>
<script>
const S = window.SITE;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const metaOf = (it) => [it.y || '未知年份', it.a].filter(Boolean).join(' · ');

/* ---------- 视图切换 ---------- */
function go(view) {
  document.querySelectorAll('.view').forEach((el) => { el.hidden = el.dataset.view !== view; });
  document.querySelectorAll('#switch button').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
  window.scrollTo({ top: 0, behavior: 'instant' });
}
$('switch').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-view]');
  if (btn) go(btn.dataset.view);
});
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-go]');
  if (a) { e.preventDefault(); go(a.dataset.go); }
});

/* ---------- 卡片 ---------- */
function card(it) {
  return `<a class="card" href="#" data-go="detail">
    <div class="art" data-name="${esc(it.n)}">
      <img src="${esc(it.c)}" alt="${esc(it.n)}" loading="lazy">
      ${it.r ? `<span class="badge">${esc(it.r)}</span>` : ''}
      <span class="playmask"><i>▶</i></span>
    </div>
    <div class="cap"><span class="t">${esc(it.n)}</span><span class="m">${esc(metaOf(it))}</span></div>
  </a>`;
}
const fill = (id, items) => { $(id).innerHTML = items.map(card).join(''); };

/* ---------- 首页 ---------- */
const heroes = S.today.slice(0, 5);
let cur = 0;
function paintHero() {
  const it = heroes[cur];
  if (!it) return;
  $('heroBg').style.backgroundImage = `url(${it.c})`;
  $('heroBlur').style.backgroundImage = `url(${it.c})`;
  $('hKick').textContent = [it.g, it.a].filter(Boolean).join('  /  ');
  $('hTitle').textContent = it.n;
  $('hMeta').innerHTML = [
    it.y ? `<b>${it.y}</b>` : '',
    it.a ? `<span>${esc(it.a)}</span>` : '',
    it.r ? `<span class="tag">${esc(it.r)}</span>` : '',
    it.e ? `<span>全 ${it.e} 集</span>` : '',
  ].filter(Boolean).join('<span class="dot"></span>');
  $('hDesc').textContent = S.desc[it.id] || '暂无简介';
  $('hIdx').textContent = `${String(cur + 1).padStart(2, '0')} / ${String(heroes.length).padStart(2, '0')}`;
  $('hDots').innerHTML = heroes.map((_, i) => `<i class="${i === cur ? 'on' : ''}"></i>`).join('');
}
$('hDots').addEventListener('click', (e) => {
  const i = [...e.currentTarget.children].indexOf(e.target);
  if (i >= 0) { cur = i; paintHero(); }
});
paintHero();
setInterval(() => { cur = (cur + 1) % heroes.length; paintHero(); }, 7000);

fill('railToday', S.today);
fill('railMovie', S.dianying.slice(0, 12));
fill('railTv', S.juji.slice(0, 12));
fill('wallAll', S.all.slice(0, 16));
$('todayN').textContent = S.today.length + ' 部';
$('totalN').textContent = S.total.toLocaleString();

/* ---------- 列表 ---------- */
$('sideNav').innerHTML = `<div class="hd">分类导航</div>` +
  [`<a class="on" href="#">全部影片<em>${S.total.toLocaleString()}</em></a>`,
   ...S.categories.map((c) => `<a href="#">${esc(c.n)}<em>›</em></a>`)].join('');
$('chipsCat').innerHTML = `<a class="chip on" href="#">全部</a>` + S.categories.map((c) => `<a class="chip" href="#">${esc(c.n)}</a>`).join('');
const years = [...new Set(S.all.map((i) => i.y).filter(Boolean))].sort((a, b) => b - a).slice(0, 5);
$('chipsYear').innerHTML = `<a class="chip on" href="#">全部</a>` + years.map((y) => `<a class="chip" href="#">${y}</a>`).join('');
$('chipsSort').innerHTML = `<a class="chip on" href="#">最新</a><a class="chip" href="#">最热</a>`;
fill('wallList', S.all);
$('pager').innerHTML = ['‹', '1', '2', '3', '4', '5', '…', '5187', '›']
  .map((p, i) => `<a class="${i === 1 ? 'on' : ''}" href="#">${p}</a>`).join('');

/* ---------- 详情 ---------- */
const D = S.detailTv;
const dv = D.vod;
$('bannerBg').style.backgroundImage = `url(${dv.c})`;
$('dPoster').innerHTML = `<img src="${esc(dv.c)}" alt="${esc(dv.n)}">`;
$('dTitle').textContent = dv.n;
$('dFacts').innerHTML = [
  dv.g ? `<span class="tag">${esc(dv.g)}</span>` : '',
  dv.y ? `<span>${dv.y}</span>` : '',
  dv.a ? `<span>${esc(dv.a)}</span>` : '',
  dv.r ? `<span>${esc(dv.r)}</span>` : '',
  dv.e ? `<span>全 ${dv.e} 集</span>` : '',
  dv.lang ? `<span>${esc(dv.lang)}</span>` : '',
].filter(Boolean).join('<span class="dot"></span>');
$('dCredits').innerHTML =
  `<div><b>导演</b>${esc(dv.director || '—')}</div>` +
  `<div><b>主演</b>${esc(dv.actor || '—')}</div>`;
$('dLines').innerHTML = D.lines.map((l, i) =>
  `<button class="line-btn ${i === 0 ? 'on' : ''}">${esc(l.name)}<em>${l.episodes} 集</em></button>`).join('');
$('dContent').textContent = dv.content || '暂无简介';
$('dEps').innerHTML = S.play.episodes.map((e, i) =>
  `<a class="${i === 0 ? 'on' : ''}" href="#" data-go="play">${esc(e.name)}</a>`).join('');
fill('dRelated', D.related);
$('dAside').innerHTML = `
  <div class="kv"><span>分类</span><b>${esc(dv.g || '—')}</b></div>
  <div class="kv"><span>年份</span><b>${dv.y || '—'}</b></div>
  <div class="kv"><span>地区</span><b>${esc(dv.a || '—')}</b></div>
  <div class="kv"><span>语言</span><b>${esc(dv.lang || '—')}</b></div>
  <div class="kv"><span>集数</span><b>${dv.e || '—'}</b></div>
  <div class="kv"><span>线路</span><b>${D.lines.length} 条</b></div>
  <div class="kv"><span>上映</span><b>${esc(dv.releaseDate || '—')}</b></div>`;

/* ---------- 播放 ---------- */
const P = S.play;
$('pBg').style.backgroundImage = `url(${P.vod.cover})`;
$('pCrumb').textContent = P.vod.name + ' · ' + (P.episodes[0]?.name || '第01集');
$('pName').textContent = P.vod.name;
$('pLine').textContent = P.lines[0]?.name || '默认线路';
$('pEpN').textContent = `共 ${P.episodes.length} 集`;
$('pLineN').textContent = `${P.lines.length} 条线路`;
$('pEpsHome').innerHTML = P.episodes.map((e, i) =>
  `<a class="${i === 0 ? 'on' : ''}" href="#">${esc(e.name)}</a>`).join('');
$('pLines').innerHTML = P.lines.map((l, i) => `
  <div class="line-row ${i === 0 ? 'on' : ''}">
    <span>${esc(l.name)}</span><span class="cnt">${l.episodes} 集</span>
  </div>`).join('');
$('pInfo').innerHTML = `
  <div class="hd">影片信息</div>
  <div style="padding:14px">
    <div class="kv"><span>片名</span><b>${esc(P.vod.name)}</b></div>
    <div class="kv"><span>状态</span><b>${esc(P.vod.remarks || '—')}</b></div>
    <div class="kv"><span>当前</span><b>${esc(P.episodes[P.current - 1]?.name || '第01集')}</b></div>
    <div class="kv"><span>来源</span><b>${esc(P.lines[0]?.sourceFrom || '—')}</b></div>
  </div>`;
</script>
</body>
</html>
