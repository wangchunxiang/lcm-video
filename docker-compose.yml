# Docker 部署（飞牛 NAS / 任意 Docker 主机）。
#
# 应用镜像在 PC 上构建后导入，见 README「部署」：
#   npm run docker:export   # 产出 lcm-video.tar
# 然后在 fnOS「Docker → 镜像 → 导入」中选中它。
#
# 使用前把仓库根的 .env.example 复制成 .env，填好 JWT_SECRET、DB_PASSWORD、
# DB_ROOT_PASSWORD。应用容器的 DATABASE_URL 由 DB_* 自动拼成，指向下面的 db 服务。
#
# 用 NAS 上已有的 MySQL/MariaDB 时：
#   1. 删掉本文件的 db 服务、volumes 以及 app 的 depends_on；
#   2. 把 app 的 DATABASE_URL 改成 mysql://用户:密码@NAS局域网IP:3306/lcm_video。
#
# 只能跑单副本：验证码与登录失败计数在进程内存，定时采集也在进程内，
# 多副本会出现验证码随机失效、锁定绕过、任务重复执行。

services:
  app:
    image: lcm-video:latest
    container_name: lcm-video
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3100"
      TZ: Asia/Shanghai
      DATABASE_URL: mysql://${DB_USER:-lcm}:${DB_PASSWORD:?DB_PASSWORD 未在 .env 中配置}@db:3306/${DB_NAME:-lcm_video}
    ports:
      - "3100:3100"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 采集任务收到 SIGTERM 后会收尾，给足退出时间
    stop_grace_period: 30s

  db:
    image: mariadb:11
    container_name: lcm-video-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-lcm_video}
      MARIADB_USER: ${DB_USER:-lcm}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未在 .env 中配置}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 未在 .env 中配置}
      TZ: Asia/Shanghai
    # 排序规则与默认时区都必须对上：应用按 +08:00 读写，DEFAULT CURRENT_TIMESTAMP
    # 用的是数据库实例时区，不一致会差 8 小时。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - dbdata:/var/lib/mysql
    # 不映射 3306：只在 compose 网络内由 app 通过服务名 db 访问
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  dbdata:
