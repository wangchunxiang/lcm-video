# Docker 部署（飞牛 NAS / 任意 Docker 主机）。
#
# 应用镜像有两种来源，见 README「部署」：
#   1. PC 构建后导入：npm run docker:export，再在 fnOS「Docker → 镜像 → 导入」
#   2. GitHub Actions 构建并推送 Docker Hub：在 .env 里设置
#      APP_IMAGE=docker.io/<用户名>/lcm-video:latest，然后 docker compose pull app
#
# 本文件不管数据库：NAS 上已有 MariaDB/MySQL，直接通过 .env 的 DATABASE_URL 连接。
# 使用前把仓库根的 .env.example 复制成 .env，填好 DATABASE_URL 与 JWT_SECRET。
#
# 连接已有数据库的三种情况：
#   1. 数据库容器已映射 3306：mysql://用户:密码@NAS局域网IP:3306/lcm_video
#   2. 数据库容器没映射端口：让本服务加入它的 Docker 网络（见文件末尾注释），
#      主机名换成数据库容器名，如 mysql://用户:密码@mariadb:3306/lcm_video
#   3. 数据库直接装在 NAS 宿主机：mysql://用户:密码@host.docker.internal:3306/lcm_video
#      （下面已配 extra_hosts，Linux 下也能解析 host.docker.internal）
#
# 只能跑单副本：验证码与登录失败计数在进程内存，定时采集也在进程内，
# 多副本会出现验证码随机失效、锁定绕过、任务重复执行。

services:
  app:
    image: ${APP_IMAGE:-lcm-video:latest}
    container_name: lcm-video
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3100"
      TZ: Asia/Shanghai
    ports:
      - "3100:3100"
    # 数据库装在 NAS 宿主机（不是容器）时，用 host.docker.internal 访问
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 采集任务收到 SIGTERM 后会收尾，给足退出时间
    stop_grace_period: 30s

# 数据库容器没有映射 3306、想直接用容器名访问时，取消下面注释，
# 把 name 换成数据库容器所在的网络（`docker inspect <容器名> -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'`）。
# 加入外部网络后，默认网络不再创建，app 通过该网络解析数据库容器名。
# networks:
#   default:
#     name: 已有数据库的网络名
#     external: true
